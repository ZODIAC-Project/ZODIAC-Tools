# RBAC for log-collector
# Adjust `namespace` as needed. This grants the collector permission to list/watch pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-collector
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-collector-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: log-collector-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: log-collector
    namespace: default
roleRef:
  kind: Role
  name: log-collector-role
  apiGroup: rbac.authorization.k8s.io
