apiVersion: batch/v1
kind: Job
metadata:
  name: sma-benchmark-run
  namespace: zodiac
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sma-benchmark-run
        app.kubernetes.io/part-of: zodiac-sustainability
    spec:
      restartPolicy: Never
      containers:
        - name: sma
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          workingDir: /output
          command:
            - /bin/sh
            - -lc
          args:
            - pip install --no-cache-dir sustainability-measurement-agent && sma run /config/config.yaml
          volumeMounts:
            - name: sma-config
              mountPath: /config
            - name: sma-output
              mountPath: /output
      volumes:
        - name: sma-config
          configMap:
            name: sma-config
        - name: sma-output
          persistentVolumeClaim:
            claimName: sma-output-pvc
