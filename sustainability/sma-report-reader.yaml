apiVersion: v1
kind: Pod
metadata:
  name: sma-report-reader
  namespace: zodiac
  labels:
    app.kubernetes.io/name: sma-report-reader
    app.kubernetes.io/part-of: zodiac-sustainability
spec:
  restartPolicy: Never
  containers:
    - name: reader
      image: busybox:1.36
      command:
        - /bin/sh
        - -lc
        - sleep 3600
      volumeMounts:
        - name: sma-output
          mountPath: /output
  volumes:
    - name: sma-output
      persistentVolumeClaim:
        claimName: sma-output-pvc
