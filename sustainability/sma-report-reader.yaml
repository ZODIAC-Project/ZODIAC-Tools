apiVersion: apps/v1
kind: Deployment
metadata:
  name: sma-report-reader
  namespace: zodiac
  labels:
    app.kubernetes.io/name: sma-report-reader
    app.kubernetes.io/part-of: zodiac-sustainability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sma-report-reader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sma-report-reader
        app.kubernetes.io/part-of: zodiac-sustainability
    spec:
      containers:
        - name: reader
          image: busybox:1.36
          command:
            - /bin/sh
            - -lc
            - sleep infinity
          volumeMounts:
            - name: sma-output
              mountPath: /output
      volumes:
        - name: sma-output
          persistentVolumeClaim:
            claimName: sma-output-pvc
