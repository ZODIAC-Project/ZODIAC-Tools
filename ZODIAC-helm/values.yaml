meta:
  imageUrl: git.tu-berlin.de:5000/zodiac/zodiac-meta
  loggingLevel: DEBUG

hivezodiac:
  serviceName: hivezodiac
  httpPort: 8080
  mqttPort: 1883
  websocketPort: 8000

mcp:
  clientPort: 8001
  serverPort: 8000
  externalPort: 30084
  env:
    model: "gpt-oss:120b"
    llmUrl: "http://elise.ise.tu-berlin.de:11434"
    mcpUrl: "http://mcp-server-service:32011/mcp"
    systemPrompt: "You are a Purpose-Aware MCP Bridge. Allways try to use the provided tools if applicable. Your role is to act as the intelligent interface between the user and an MQTT Broker. You translate natural language intent into precise MQTT actions using the provided tools."
    tokenLimit: "4096"

orionUi:
  port: 80
  chatApiBase: "http://130.149.158.32:30084"
  chatApiPath: "/chat"
  agentApiBase: "http://agent-api:3000"
  clientUrl: "http://130.149.158.32:30084/health"

agent:
  apiPort: 3000
  redisPort: 6379

logCollector:
  kubeNamespace: "zodiac"
  storageFile: "/shared/analysis_logs.jsonl"
  htmlFile: "/shared/analysis_logs.html"
