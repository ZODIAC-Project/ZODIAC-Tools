apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: zodiac
  name: stream-manager
  labels:
    app: stream-manager
  annotations:
    keel.sh/policy: minor
    keel.sh/trigger: poll

spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-manager
  template:
    metadata:
      labels:
        app: stream-manager
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: stream-manager
          image: "{{ .Values.meta.imageUrl }}/stream-manager:0.2.0-cicd"
          imagePullPolicy: IfNotPresent
          env:
            - name: LOGGING_LEVEL
              value: {{ .Values.meta.loggingLevel }}
            - name: MQTT_BROKER
              value: {{ .Values.streamManager.mqttBroker }}
            - name: AGENT_CALLBACK_PORT
              value: {{ .Values.streamManager.agentCallbackPort }}
            - name: AGENT_CALLBACK_PATH
              value: {{ .Values.streamManager.agentCallbackPath }}
            - name: MAX_TOPICS_PER_SESSION
              value: {{ .Values.streamManager.maxTopicsPerSession }}
            - name: PORT
              value: {{ .Values.streamManager.port }}
          ports:
            - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  namespace: zodiac
  name: stream-manager
spec:
  type: ClusterIP
  selector:
    app: stream-manager
  ports:
    - protocol: TCP
      port: {{.Values.streamManager.port}}
      targetPort: {{.Values.streamManager.port}}
---
apiVersion: v1
kind: Service
metadata:
  namespace: zodiac
  name: stream-manager-external
spec:
  type: NodePort
  selector:
    app: stream-manager
  ports:
    - protocol: TCP
      port: {{.Values.streamManager.port}}
      targetPort: {{.Values.streamManager.port}}
      nodePort: {{.Values.streamManager.nodePort}}