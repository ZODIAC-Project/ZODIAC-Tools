apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: zodiac
  name: mcp-server
  labels:
    app: mcp-server
  annotations:
    keel.sh/policy: minor
    keel.sh/trigger: poll

spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: mcp-server
          image: "{{ .Values.meta.imageUrl }}/mcp-server:0.8.0-cicd"
          imagePullPolicy: IfNotPresent
          env:
            - name: LOGGING_LEVEL
              value: "{{ .Values.meta.loggingLevel }}"
          ports:
            - containerPort: {{.Values.mcp.serverPort}}

---
apiVersion: v1
kind: Service
metadata:
  namespace: zodiac
  name: mcp-server-service
spec:
  type: NodePort
  selector:
    app: mcp-server
  ports:
    - name: mcp-streamable-http
      protocol: TCP
      targetPort: {{.Values.mcp.serverPort}}
      port: 32011
      nodePort: 32012
