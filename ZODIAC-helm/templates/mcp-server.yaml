apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: zodiac
  name: mcp-server
  labels:
    app: mcp-server
  annotations:
    keel.sh/policy: minor
    keel.sh/trigger: poll

spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: mcp-server
          image: "{{ .Values.meta.imageUrl }}/mcp-server:0.1.0-cicd"
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: "{{ .Values.meta.loggingLevel }}"
            - name: MQTT_SERVER
              value: {{.Values.hivezodiac.serviceName}}
            - name: MQTT_CLIENT_PORT
              value: "{{.Values.hivezodiac.mqttPort}}"
            - name: MCP_SERVER_PORT
              value: "{{.Values.mcp.serverPort}}"
            - name: AGENT_SERVER_URL
              value: "http://agent-api:{{ .Values.agent.port }}/agent"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{.Values.mcp.env.otel_exporter_endpoint}}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "mcp-server"
            - name: OTEL_SERVICE_NAMESPACE
              value: "zodiac"
            - name: STREAM_MANAGER_URL
              value: "{{.Values.mcp.env.stream_manager_url}}"
            - name: RAG_SERVICE_URL
              value: "http://{{ .Values.ragService.serviceName }}:{{ .Values.ragService.port }}"
          ports:
            - containerPort: {{.Values.mcp.serverPort}}

---
apiVersion: v1
kind: Service
metadata:
  namespace: zodiac
  name: mcp-server-service
spec:
  type: NodePort
  selector:
    app: mcp-server
  ports:
    - name: mcp-streamable-http
      protocol: TCP
      targetPort: {{.Values.mcp.serverPort}}
      port: 32011
      nodePort: 32012
