apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: zodiac
  name: agent-api
  labels:
    app: agent-api
  annotations:
    keel.sh/policy: minor
    keel.sh/trigger: poll

spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-api
  template:
    metadata:
      labels:
        app: agent-api
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: agent
          image: "{{ .Values.meta.imageUrl }}/new-agent:0.5.0-cicd"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.agent.port }}
          env:
            - name: MCP_URL
              value: "{{.Values.orionUi.chatApiBase}}{{.Values.orionUi.chatApiPath}}"
---
apiVersion: v1
kind: Service
metadata:
  namespace: zodiac
  name: agent-api
spec:
  type: NodePort
  selector:
    app: agent-api
  ports:
    - name: http-legacy
      protocol: TCP
      port: 3000
      targetPort: {{ .Values.agent.port }}
      nodePort: {{ .Values.agent.legacyNodePort }}
    - name: http-agent
      protocol: TCP
      port: {{ .Values.agent.port }}
      targetPort: {{ .Values.agent.port }}
      nodePort: {{ .Values.agent.nodePort }}
